# .goreleaser.yaml

version: 2

env:
  - GO111MODULE=on

before:
  hooks:
    - go mod tidy

# Snapshot builds are unreleased builds of whatever the tree currently is. The
# master prerelease workflow uses these, so the version carries the commit it was
# built from — an artifact on disk can be traced back to master without relying on
# the release page it came from.
#
# goreleaser's own `nightly` support is a Pro feature, so the master prerelease is
# assembled from a snapshot build and published by .github/workflows/nightly.yml.
snapshot:
  version_template: "{{ incpatch .Version }}-master-{{ .ShortCommit }}"

gomod:
  proxy: true

report_sizes: true

git:
  ignore_tags:
    - "{{ if not .IsNightly }}nightly{{ end }}"

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm
      - arm64
      - riscv64
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      # Go only supports riscv64 on linux (and openbsd, which we do not target).
      - goos: windows
        goarch: riscv64
      - goos: darwin
        goarch: riscv64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      # treeState is rendered as a word rather than {{ .IsGitDirty }}'s bare
      # boolean, which made `rwr version` report "tree state: false".
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{ .CommitDate }} -X main.builtBy=goreleaser -X main.treeState={{ if .IsGitDirty }}dirty{{ else }}clean{{ end }}

universal_binaries:
  - replace: false

checksum:
  name_template: "checksums.txt"

# An SPDX SBOM per archive, so what went into a build is inspectable without
# rebuilding it. Requires syft on the PATH (installed in the workflows).
sboms:
  - artifacts: archive

# Keyless cosign signature over checksums.txt. The installers verify artifacts
# against the checksums file, but that file was served from the same release it
# protects — integrity without authenticity. Signing the checksums file
# transitively covers every artifact it lists.
#
# Keyless: the signature is bound to this repository's GitHub Actions OIDC
# identity (no key to store or leak), verifiable with:
#
#   cosign verify-blob checksums.txt \
#     --signature checksums.txt.sig --certificate checksums.txt.pem \
#     --certificate-identity-regexp 'github.com/FynxLabs/rwr' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    signature: "${artifact}.sig"
    args:
      - sign-blob
      - --output-certificate=${certificate}
      - --output-signature=${signature}
      - ${artifact}
      - --yes
    artifacts: checksum
    output: true

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^test:"
      - "^test\\("
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: Dependency updates
      regexp: '^.*?(.+)\(deps\)!?:.+$'
      order: 300
    - title: "New Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 100
    - title: "Security updates"
      regexp: '^.*?sec(\(.+\))??!?:.+$'
      order: 150
    - title: "Bug fixes"
      regexp: '^.*?(fix|refactor)(\(.+\))??!?:.+$'
      order: 200
    - title: "Documentation updates"
      regexp: ^.*?docs?(\(.+\))??!?:.+$
      order: 400
    - title: "Build process updates"
      regexp: ^.*?(build|ci)(\(.+\))??!?:.+$
      order: 400
    - title: Other work
      order: 9999

archives:
  - name_template: >-
      {{- .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
    # Using the new format for archives configuration
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    builds_info:
      group: root
      owner: root

nfpms:
  - file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    id: packages
    homepage: https://github.com/fynxlabs/rwr
    description: "Rinse, Wash, Repeat (RWR) - Configuration Management Tool"
    maintainer: "Levi Smith <levi@fynxlabs.io>"
    license: MIT
    vendor: FynxLabs
    bindir: /usr/bin
    section: utils
    formats:
      - apk
      - deb
      - rpm
      - archlinux
    recommends:
      - git
      - curl
      - wget

homebrew_casks:
  - repository:
      owner: FynxLabs
      name: brew-tap
      git:
        url: "ssh://git@github.com/FynxLabs/brew-tap.git"
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    # Casks live in Casks/, not Formula/ — a cask written into a Formula directory
    # is not what `brew install rwr` looks for.
    directory: Casks
    homepage: "https://github.com/fynxlabs/rwr"
    description: "Rinse, Wash, Repeat (RWR) - Configuration Management Tool"
    # "auto" skips prereleases, which keeps the nightly master builds out of the
    # tap — `brew install rwr` should only ever give you a real release.
    skip_upload: "auto"

release:
  name_template: "v{{ .Version }}"
  # "auto" marks a release as a prerelease when its version carries a prerelease
  # part, which the nightly version template always does.
  prerelease: auto
  footer: |
    **Full Changelog**: https://github.com/fynxlabs/rwr/compare/{{ .PreviousTag }}...{{ if .IsNightly }}nightly{{ else }}{{ .Tag }}{{ end }}
