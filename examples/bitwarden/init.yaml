blueprints:
  format: yaml
  location: .
  except: [credentials]
credentialPolicy:
  setup: explicit
  onUnavailable: skip
credentialProviders:
  - name: personal-vault
    provider: bitwarden
    server: https://vault.bitwarden.com
credentials:
  - name: gpg_passphrase
    sources: [env:RWR_CRED_GPG_PASSPHRASE, keyring]
    scope: [credentials]
    references:
      - connection: personal-vault
        item: gpg-signing
        field: password
credentialAttachments:
  - name: signing-key
    connection: personal-vault
    item: gpg-signing
    filename: private.asc
    write: true
