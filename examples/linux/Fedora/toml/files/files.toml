templates = [
    { name = ".profile", action = "copy", source = "./src/", target = "{{ .User.home }}/" },
]

[[files]]
name = ".bashrc"
action = "create"
target = "{{ .User.home }}/"
content = "# Custom .bashrc content\nalias ll='ls -alF'\nexport PATH=$PATH:$HOME/.local/bin\n"

[[files]]
name = ".gitignore"
action = "copy"
target = "{{ .User.home }}/"
source = "./src/"

[[files]]
name = ".vimrc"
profiles = [
    "dev",
]
action = "create"
target = "{{ .User.home }}/"
content = "set number\nset tabstop=4\nset shiftwidth=4\nset expandtab\n"

[[directories]]
name = "Projects"
action = "create"
target = "{{ .User.home }}/"
mode = 493

[[directories]]
name = ".config/code"
profiles = [
    "dev",
]
action = "create"
target = "{{ .User.home }}/"
mode = 493
