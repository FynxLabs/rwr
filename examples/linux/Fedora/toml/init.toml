packageManagers = [
    { name = "cargo", action = "install" },
    { name = "brew", action = "install" },
]

[blueprints]
format = "toml"
schema_version = 1
location = "."
order = [
    "repositories",
    "packages",
    "files",
    "fonts",
    "services",
    "git",
    "scripts",
    "users",
    "ssh_keys",
    "configuration",
]
