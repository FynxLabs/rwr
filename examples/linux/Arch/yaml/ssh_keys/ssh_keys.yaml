ssh_keys:
  # Default personal SSH key - always created
  - name: id_ed25519
    type: ed25519
    path: "{{ .User.home }}/.ssh/"
    comment: "{{ .User.username }}@personal"
    no_passphrase: false
    copy_to_github: false

  # Work-specific SSH key
  - name: id_work
    profiles:
      - work
    type: ed25519
    path: "{{ .User.home }}/.ssh/"
    comment: "{{ .User.username }}@company.com"
    no_passphrase: false
    copy_to_github: false

  # GitHub-specific SSH key with automatic upload
  - name: id_github
    profiles:
      - dev
      - github
    type: ed25519
    path: "{{ .User.home }}/.ssh/"
    comment: "{{ .User.username }}@github"
    no_passphrase: true
    copy_to_github: true
    github_title: "{{ .User.username }} Development Machine"

  # Legacy RSA key for older systems
  - name: id_rsa_legacy
    profiles:
      - legacy
      - work
    type: rsa
    path: "{{ .User.home }}/.ssh/"
    comment: "{{ .User.username }}@legacy-systems"
    no_passphrase: false
    copy_to_github: false

  # Server deployment key
  - name: id_deploy
    profiles:
      - deploy
      - work
    type: ed25519
    path: "{{ .User.home }}/.ssh/"
    comment: "{{ .User.username }}@deployment"
    no_passphrase: true
    copy_to_github: false

  # Gaming/Steam remote play key
  - name: id_gaming
    profiles:
      - gaming
    type: ed25519
    path: "{{ .User.home }}/.ssh/"
    comment: "{{ .User.username }}@gaming-rig"
    no_passphrase: true
    copy_to_github: false

  # Backup server key
  - name: id_backup
    profiles:
      - backup
      - personal
    type: ed25519
    path: "{{ .User.home }}/.ssh/"
    comment: "{{ .User.username }}@backup-server"
    no_passphrase: false
    copy_to_github: false

  # Main RWR SSH key for configuration management
  - name: id_rwr
    profiles:
      - dev
      - work
    type: ed25519
    path: "{{ .User.home }}/.ssh/"
    comment: "{{ .User.username }}@rwr-management"
    no_passphrase: true
    copy_to_github: false
    set_as_rwr_ssh_key: true

  # Multi-profile key for various cloud services
  - name: id_cloud
    profiles:
      - aws
      - gcp
      - azure
      - cloud
    type: ed25519
    path: "{{ .User.home }}/.ssh/"
    comment: "{{ .User.username }}@cloud-services"
    no_passphrase: false
    copy_to_github: false

  # Container/Docker host key
  - name: id_docker
    profiles:
      - docker
      - dev
    type: ed25519
    path: "{{ .User.home }}/.ssh/"
    comment: "{{ .User.username }}@docker-host"
    no_passphrase: true
    copy_to_github: false
