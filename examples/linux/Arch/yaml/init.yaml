blueprints:
  format: yaml
  schema_version: 1
  location: .
  order:
  - repositories
  - packages
  - files
  - fonts
  - services
  - git
  - scripts
  - users
  - ssh_keys
  - configuration
packageManagers:
- name: cargo
  action: install
- name: brew
  action: install
variables:
  userDefined:
    company: MyCompany
    department: Engineering
    editor_theme: dracula
    editor_plugins: basic
credentials:
- name: example_api_token
  description: Example API token used by scripts in this tree
  sources:
  - env:EXAMPLE_API_TOKEN
  - keyring
  - prompt
  scope:
  - scripts
exposeCredentials:
- example_api_token
