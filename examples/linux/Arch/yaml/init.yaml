blueprints:
  format: yaml
  location: .
  order:
  - repositories
  - packages
  - files
  - fonts
  - services
  - git
  - scripts
  - users
  - ssh_keys
  - configuration
packageManagers:
- name: cargo
  action: install
- name: brew
  action: install
variables:
  userDefined:
    company: MyCompany
    department: Engineering
    editor_theme: dracula
    editor_plugins: basic
