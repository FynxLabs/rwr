[provider]
name = "pamac"
elevated = true

[provider.detection]
binary = "pamac"
files = ["/etc/pacman.conf", "/var/lib/pacman"]
distributions = ["arch", "cachyos", "linux/cachyos", "manjaro", "linux/acreetion"]

[provider.commands]
install = "build --no-confirm"     # build for AUR packages
update = "upgrade -a --no-confirm" # -a for AUR updates
remove = "remove --no-confirm"     # remove packages
list = "list -i"                   # -i to list installed packages
list_explicit = "list --explicitly-installed"
search = "search -a"               # -a to search both repos and AUR
clean = "clean --no-confirm"       # clean cache

[provider.corePackages]
openssl = ["openssl"]
build-essentials = [
  "base-devel",
  "cmake",
  "freetype2",
  "fontconfig",
  "pkg-config",
  "libxcb",
  "libxkbcommon",
  "python",
]

[provider.repository.paths]
sources = "/etc/pacman.d"
keys = "/etc/pacman.d/gnupg"
# pacman.conf is where a repository section lands. It is declared here both so
# the steps below can render it and so that the containment check has a path to
# allow: an edit outside these paths is refused.
config = "/etc/pacman.conf"

[[provider.install.steps]]
action = "command"
exec = "pacman"
args = ["-S", "--needed", "--noconfirm", "base-devel", "git"]

[[provider.install.steps]]
action = "command"
exec = "git"
args = ["clone", "https://aur.archlinux.org/pamac-aur.git", "{{ .TempDir }}/pamac"]

[[provider.install.steps]]
action = "command"
exec = "sh"
args = ["-c", "cd {{ .TempDir }}/pamac && makepkg -si --noconfirm"]

[[provider.remove.steps]]
action = "command"
exec = "pacman"
args = ["-Rns", "--noconfirm", "pamac-aur"]

# Appended, never written: a write replaces pacman.conf wholesale and takes
# every other repository and option in it with it.
[[provider.repository.add.steps]]
action = "append"
path = "{{ .ConfigPath }}"
content = """
[{{ .Name }}]
Server = {{ .URL }}
"""

[[provider.repository.add.steps]]
action = "command"
exec = "pacman-key"
args = ["--recv-keys", "{{ .KeyID }}"]
condition = "{{ .HasKey }}"

[[provider.repository.add.steps]]
action = "command"
exec = "pacman-key"
args = ["--lsign-key", "{{ .KeyID }}"]
condition = "{{ .HasKey }}"

[[provider.repository.remove.steps]]
action = "command"
exec = "pacman-key"
args = ["--delete", "{{ .KeyID }}"]
condition = "{{ .HasKey }}"

[[provider.repository.remove.steps]]
action = "remove_section"
path = "{{ .ConfigPath }}"
section = "{{ .Name }}"
