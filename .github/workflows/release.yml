name: RWR - Release

# Stable releases can be selected in Actions or started by pushing a version tag.
# The nightly tag remains exclusive to the master prerelease workflow.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      commit:
        description: "Merged commit SHA (blank = master revision selected for this run)"
        required: false
        type: string
  push:
    tags:
      - "v*"
permissions:
  contents: read

# Serialize version reservation and publishing across manual and tag-triggered
# runs. Never cancel a release halfway through uploading artifacts.
concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - name: Checkout selected workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Reserve the next release tag
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: python3 scripts/prepare-release.py --bump "$RELEASE_TYPE" --commit "$RELEASE_COMMIT"

  goreleaser:
    permissions:
      contents: write
      # Keyless signing requires OIDC only in the publishing job.
      id-token: write
    needs: prepare
    # Tags pushed with GITHUB_TOKEN do not start another push workflow. Publish
    # directly in this run, and still allow ordinary version-tag pushes.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.prepare.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag && format('refs/tags/{0}', needs.prepare.outputs.tag) || github.ref }}
          fetch-depth: 0
      # The same constraint go.yml tests with (and mise.toml pins locally for
      # GO-2026-5856). `stable` here meant release binaries could be built by a
      # toolchain no CI run had ever tested.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ">=1.27.2"

      # cosign signs checksums.txt, syft writes the SBOMs - both invoked by
      # goreleaser (signs: / sboms: in .goreleaser.yaml).
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin the binary, not just the action: an unpinned install tracks
          # cosign's latest, whose sign-blob CLI has broken the signs: block
          # before (the 3.x bundle-format switch). Renovate keeps this current.
          cosign-release: "v3.1.3"
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Trigger naur repo update
        if: success()
        env:
          GH_TOKEN: ${{ secrets.NAUR_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::notice::NAUR_DISPATCH_TOKEN is not configured; naur will pick up this release on its daily update."
            exit 0
          fi

          gh api /repos/tenebrux/naur/dispatches -f event_type=release
