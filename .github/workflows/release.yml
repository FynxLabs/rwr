name: RWR - Release

# Only version tags cut a release. "*" meant any tag — a typo, an experiment,
# a manually pushed `nightly` — published to GitHub, the Homebrew tap and the
# naur dispatch. Release tags here have always been v-prefixed (v0.5.1).
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
  # Keyless cosign signing exchanges the job's OIDC token for a short-lived
  # certificate; no signing key is stored anywhere.
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The same constraint go.yml tests with (and mise.toml pins locally for
      # GO-2026-5856). `stable` here meant release binaries could be built by a
      # toolchain no CI run had ever tested.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ">=1.26.5"

      # cosign signs checksums.txt, syft writes the SBOMs — both invoked by
      # goreleaser (signs: / sboms: in .goreleaser.yaml).
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Trigger naur repo update
        if: success()
        run: gh api /repos/FynxLabs/naur/dispatches -f event_type=release
        env:
          GH_TOKEN: ${{ secrets.NAUR_DISPATCH_TOKEN }}