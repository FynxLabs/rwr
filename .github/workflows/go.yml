name: Go Build & Test

on:
  push:
    branches: ["master"]
  # Every pull request gets checked, not only those targeting master. Stacked
  # branches (a PR based on another PR's branch) otherwise merge with no CI at all.
  pull_request:

permissions:
  contents: read

jobs:
  # RWR provisions Linux, macOS and Windows, so it is built on all three. Building
  # only on ubuntu meant internal/system/windows.go and the darwin paths were never
  # compiled by CI: a change that broke them shipped, and the first person to find
  # out was a user on that platform.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should still tell you about the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ">=1.26.6"

      - name: Build
        run: go build -v ./...

      # vet type-checks the test files too, so this is also the guarantee that the
      # whole tree - tests included - compiles for this platform.
      - name: Vet
        run: go vet ./...

      # -race, matching the pre-push hook (hk.pkl). CI ran the tests without it,
      # which made CI weaker than the hook contributors run locally. The same
      # run writes the coverage profile the gate below reads.
      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -coverprofile=coverage.out -v ./...

      # Coverage gate: total must stay at or above the ratcheting threshold
      # (set from the measured baseline; see
      # openspec/changes/add-coverage-reporting/baseline.md).
      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/coverage-gate.sh coverage.out

      # macOS gates. The suite passes there now: the two failures that kept it
      # advisory were both fixtures describing a machine that cannot exist (a
      # Mac with no package manager at all), fixed in #256, and nothing else in
      # the suite has surfaced since.
      #
      # This matters beyond CI. hk's pre-push hook runs `go test -race ./...`,
      # so contributors on a Mac already gate on this suite locally; leaving the
      # macOS leg advisory made CI weaker than the hook they run before every
      # push, on the platform rwr has most recently been hardened for.
      - name: Test (macOS)
        if: matrix.os == 'macos-latest'
        run: go test -race -v ./...

      # Windows is still reporting only.
      #
      # A good deal of the suite assumes POSIX behaviour - unix file modes,
      # /bin/bash, path separators - and nobody has triaged what that costs
      # there. Gating on an unmeasured suite would paint master red for reasons
      # unrelated to whatever change is being reviewed. This surfaces the
      # failures so they can be fixed at their source; delete continue-on-error
      # once that is done, so every platform rwr provisions is really tested.
      - name: Test (Windows, not yet gating)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: go test -race -v ./...

  # The build matrix above compiles natively: linux/amd64, darwin/arm64,
  # windows/amd64. The release ships more targets than that - linux/arm 32-bit,
  # linux/riscv64, linux/arm64, windows/arm64, darwin/amd64 - and none of them
  # was compiled before merge, so a target-specific break (a constant that
  # overflows 32-bit int, a missing syscall) surfaced only when the release ran.
  # That is exactly how the linux_arm_7 math.MaxInt64 break reached master.
  #
  # goreleaser build compiles every target from .goreleaser.yaml itself, so this
  # job can never drift from the release matrix. CGO is off; all targets
  # cross-compile from one runner.
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # goreleaser reads git state; a shallow clone breaks its version math.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ">=1.26.6"

      - name: Build every release target
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean

  # cross-compile only exercises `goreleaser build`; the signs:/sboms:/nfpms:
  # blocks only ever ran inside a real tag push or the master prerelease, which
  # is how the cosign 3.x sign-blob CLI change could break every release and
  # nightly before anything caught it. This runs the full release pipeline as a
  # snapshot - including the cosign signing step - before merge. Keyless signing
  # needs an OIDC token, which fork PRs do not get, so those are skipped (they
  # still run cross-compile).
  release-snapshot:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # goreleaser reads git state; a shallow clone breaks its version math.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ">=1.26.6"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Same pin as release.yml/nightly.yml: this job exists to prove the
          # exact binary the release will use can still sign.
          cosign-release: "v3.1.3"
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Release snapshot (no publish)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Provider definitions are CUE, embedded and evaluated by the binary
  # itself; go test exercises the evaluation. vet catches schema violations
  # with better errors than a test failure does.
  cue-providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ">=1.26.6"

      # Same version the module depends on; `go run` needs no extra installer.
      - name: cue vet
        run: go run cuelang.org/go/cmd/cue@v0.17.1 vet ./internal/system/definitions/


  # golangci-lint gates every commit locally, through mise (`mise run lint`) and
  # the hk pre-commit hook - but only for contributors who ran `mise install`.
  # Anyone else got no lint at all, and neither did any pull request.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ">=1.26.6"

      # Reads .golangci.yml from the repo root, so this runs the same rules as
      # `golangci-lint run` locally - there is no second copy of the config to drift.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # Pinned like the other gate tooling: a lint release must not change
          # what merges under a PR that didn't touch it.
          version: v2.12.2

  # install.sh and install.ps1 are how most people get rwr, and nothing checked
  # them. Both were rewritten recently with no CI coverage at all.
  #
  # The installers are analysed, never executed: running them would download and
  # install release artifacts, which tests the release rather than the script.
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # shellcheck is preinstalled on the ubuntu runners.
      - name: shellcheck install.sh
        run: shellcheck install.sh

      # Parses install.ps1 without running any of it. This needs no extra modules,
      # so it is a hard gate: a syntax error in the Windows installer breaks the
      # only supported way to install on Windows.
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1).Path, [ref]$null, [ref]$errors)
          if ($errors) {
            $errors | ForEach-Object {
              Write-Host "::error file=install.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)"
            }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly"

      # Gating. PSAvoidUsingWriteHost is excluded deliberately: install.ps1 is
      # a console script whose entire output is for the human running it -
      # Write-Host is the right tool there, and it was the only finding class.
      - name: PSScriptAnalyzer install.ps1
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -ErrorAction Stop
          $findings = Invoke-ScriptAnalyzer -Path ./install.ps1 -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost
          $findings | Format-Table -AutoSize
          if ($findings) { exit 1 }

  # The examples are the closest thing to a compatibility contract with users:
  # every blueprint field they use is a field somebody's real blueprint uses too.
  # Breaking one silently is easy, because the decoders RWR uses ignore unknown
  # keys - a renamed field turns every blueprint using it into a no-op rather
  # than an error. These checks make that a failed build instead.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ">=1.26.6"

      # Asserts every example parses in its declared format, resolves without
      # referencing a template variable that does not exist, decodes strictly
      # into its blueprint struct with no unknown keys, and that the yaml, json
      # and toml copies describe the same thing.
      - name: Validate example blueprints
        run: go test -v ./internal/validate/ -run TestExamples_

      # Runs the real binary over every example tree, the way a user would.
      - name: Run rwr validate over every example tree
        run: |
          set -euo pipefail
          go build -o rwr .
          status=0
          found=0
          while IFS= read -r init; do
            found=$((found + 1))
            tree="$(dirname "$init")"
            echo "::group::rwr validate $tree"
            ./rwr validate --blueprints "$tree" || status=1
            echo "::endgroup::"
          done < <(find examples \( -name 'init.*' -o -name 'manifest.*' \) | sort)
          if [ "$found" -eq 0 ]; then
            echo "No init files found under examples/ - this loop validated nothing." >&2
            exit 1
          fi
          echo "Validated $found example trees."
          exit "$status"

      # The loop above only reaches a directory that has an init file at or
      # above it, so a blueprint tree without one is never validated and
      # nothing says so. Every current tree is covered (examples/imports/ got
      # its init file); this keeps it that way.
      - name: Every example tree is reachable by rwr validate
        run: |
          set -euo pipefail
          uncovered=""
          while IFS= read -r dir; do
            d="$dir"
            covered=no
            while [ "$d" != "examples" ] && [ "$d" != "." ] && [ "$d" != "/" ]; do
              if ls "$d"/init.* >/dev/null 2>&1 || ls "$d"/manifest.* >/dev/null 2>&1; then covered=yes; break; fi
              d="$(dirname "$d")"
            done
            [ "$covered" = yes ] || uncovered="${uncovered}${dir}"$'\n'
          done < <(
            find examples -type f \
              \( -name '*.yaml' -o -name '*.yml' -o -name '*.json' -o -name '*.toml' \) \
              -printf '%h\n' | sort -u
          )

          if [ -n "$uncovered" ]; then
            echo "::error::These example directories have no init file at or above them, so 'rwr validate' cannot reach them:"
            printf '%s' "$uncovered"
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ">=1.26.6"

      # gosec runs with #nosec annotations honored. Every suppression in the tree is
      # scoped to its rule id and carries a justification; the ones marked TODO(PRn)
      # are removed as those PRs land, so this job gets stricter over time, never looser.
      # Pinned: @latest meant the security gates could change (or break) under
      # any PR with no reviewable diff. Renovate proposes updates to these pins.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec ./...

      # Fails on any known vulnerability reachable from our code paths.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
