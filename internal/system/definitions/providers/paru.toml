[provider]
name = "paru"
elevated = false

[provider.detection]
binary = "paru"
files = ["/etc/pacman.conf", "/var/lib/pacman"]
distributions = ["arch", "cachyos", "linux/cachyos", "manjaro", "linux/acreetion"]

[provider.commands]
install = "-S --noconfirm"  # -S for install, paru handles sync
update = "-Sua --noconfirm" # -Sua for AUR updates only
remove = "-Rns --noconfirm" # -Rns to remove with dependencies and config
list = "-Qm"                # -Qm to list foreign (AUR) packages
search = "-Ss"              # -Ss searches both repos and AUR
clean = "-Scc --noconfirm"  # -Scc for complete cache clean

[provider.corePackages]
openssl = ["openssl"]
build-essentials = [
  "base-devel",
  "cmake",
  "freetype2",
  "fontconfig",
  "pkg-config",
  "libxcb",
  "libxkbcommon",
  "python",
]

[provider.repository.paths]
sources = "/etc/pacman.d"
keys = "/etc/pacman.d/gnupg"
# pacman.conf is where a repository section lands. It is declared here both so
# the steps below can render it and so that the containment check has a path to
# allow: an edit outside these paths is refused.
config = "/etc/pacman.conf"

[[provider.install.steps]]
action = "command"
exec = "pacman"
args = ["-S", "--needed", "--noconfirm", "base-devel", "git"]

[[provider.install.steps]]
action = "command"
exec = "git"
args = ["clone", "https://aur.archlinux.org/paru.git", "/tmp/paru"]

[[provider.install.steps]]
action = "command"
exec = "sh"
args = ["-c", "cd /tmp/paru && makepkg -si --noconfirm"]

[[provider.remove.steps]]
action = "command"
exec = "pacman"
args = ["-Rns", "--noconfirm", "paru"]

# Appended, never written: a write replaces pacman.conf wholesale and takes
# every other repository and option in it with it.
[[provider.repository.add.steps]]
action = "append"
path = "{{ .ConfigPath }}"
content = """
[{{ .Name }}]
Server = {{ .URL }}
"""

[[provider.repository.add.steps]]
action = "command"
exec = "pacman-key"
args = ["--recv-keys", "{{ .KeyID }}"]
condition = "{{ .HasKey }}"

[[provider.repository.add.steps]]
action = "command"
exec = "pacman-key"
args = ["--lsign-key", "{{ .KeyID }}"]
condition = "{{ .HasKey }}"

[[provider.repository.remove.steps]]
action = "command"
exec = "pacman-key"
args = ["--delete", "{{ .KeyID }}"]
condition = "{{ .HasKey }}"

[[provider.repository.remove.steps]]
action = "remove_section"
path = "{{ .ConfigPath }}"
section = "{{ .Name }}"
