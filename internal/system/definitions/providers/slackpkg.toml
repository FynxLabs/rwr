[provider]
name = "slackpkg"
elevated = true   # Slackpkg requires root privileges

[provider.detection]
binary = "slackpkg"
files = ["/usr/sbin/slackpkg", "/etc/slackpkg", "/var/lib/slackpkg"]
distributions = ["slackware"]

[provider.commands]
install = "install"
update = "update"
remove = "remove"
list = "search installed"
search = "search"
clean = "clean-system"

[provider.repository.paths]
# The steps below render these as {{ .SourcesPath }} and {{ .KeyPath }}, which
# only decode from sources/keys/config; under their previous names they decoded
# to nothing and every step that used them had no path.
sources = "/etc/slackpkg/mirrors"
keys = "/etc/slackpkg/gpg"
config = "/etc/slackpkg/blacklist"

[[provider.repository.add.steps]]
action = "command"
exec = "sed"
args = [
  "-i",
  "s/^[^#].*//",
  "{{ .SourcesPath }}",
] # Comment out all active mirrors

[[provider.repository.add.steps]]
action = "append"
path = "{{ .SourcesPath }}"
content = "{{ .URL }}"

[[provider.repository.add.steps]]
action = "download"
source = "{{ .KeyURL }}"
dest = "{{ .KeyPath }}"
condition = "{{ .HasKey }}"

[[provider.repository.add.steps]]
action = "command"
exec = "slackpkg"
args = ["update", "gpg"]
condition = "{{ .HasKey }}"

[[provider.repository.add.steps]]
action = "command"
exec = "slackpkg"
args = ["update"]

[[provider.repository.remove.steps]]
action = "remove_line"
path = "{{ .SourcesPath }}"
match = "{{ .URL }}"

[[provider.repository.remove.steps]]
action = "remove"
path = "{{ .KeyPath }}"
condition = "{{ .HasKey }}"

[[provider.repository.remove.steps]]
action = "command"
exec = "slackpkg"
args = ["update"]
